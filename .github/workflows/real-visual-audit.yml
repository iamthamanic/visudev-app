name: Real Visual Audit

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  readiness-matrix:
    name: Product Readiness matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - name: Checkout VisuDev
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install VisuDev dependencies
        run: npm ci

      - name: Generate readiness matrix from golden-projects.manifest.json
        id: gen
        shell: bash
        run: |
          set -euo pipefail
          test -f .qa/readiness/golden-projects.manifest.json
          mkdir -p /tmp/visudev-readiness-matrix
          MATRIX=$(node scripts/readiness/resolve-matrix.mjs --out /tmp/visudev-readiness-matrix)
          echo "matrix<<EOF" >> "$GITHUB_OUTPUT"
          echo "$MATRIX" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Upload readiness matrix report
        uses: actions/upload-artifact@v4
        with:
          name: readiness-matrix-report
          path: /tmp/visudev-readiness-matrix/
          if-no-files-found: error
          retention-days: 7

  audit:
    name: Readiness Gate (${{ matrix.displayName }}, enrichment OFF)
    needs: readiness-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.readiness-matrix.outputs.matrix) }}
    env:
      VITE_VISUDEV_MODE: local
      VITE_VISUDEV_ENGINE_URL: http://127.0.0.1:4317
      VISUDEV_ENGINE_HOST: 127.0.0.1
      VISUDEV_ENGINE_PORT: "4317"
      VISUDEV_PREVIEW_RUNNER_URL: http://127.0.0.1:4000
      VISUDEV_DEMO_ENRICHMENT: "false"
      VITE_BLUEPRINT_DEMO_ENRICHMENT: "false"
      USE_DOCKER: "0"
      PORT: "4000"
      VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjIwOTAxMjUyODV9.e2e-ci-placeholder-signature
      VISUDEV_AUDIT_OUT: /tmp/visudev-real-visual-audit/${{ matrix.id }}

    steps:
      - name: Checkout VisuDev
        uses: actions/checkout@v4

      - name: Checkout pinned GitHub target
        id: checkout_target
        if: matrix.sourceKind == 'github'
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.checkoutRepository }}
          ref: ${{ matrix.checkoutRef }}
          path: target-repo
          fetch-depth: 20
          token: ${{ secrets.VISUDEV_READINESS_GH_TOKEN || github.token }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Setup Deno
        if: matrix.gateMode == 'full'
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install VisuDev dependencies
        run: npm ci

      - name: Install Chromium
        if: matrix.gateMode == 'full'
        run: npx playwright install chromium --with-deps

      - name: Start VisuDev stack with demo enrichment OFF
        if: matrix.gateMode == 'full'
        shell: bash
        run: |
          set -euo pipefail
          export VISUDEV_STORAGE_DIR="$GITHUB_WORKSPACE/.audit-visudev-storage"
          mkdir -p "$VISUDEV_STORAGE_DIR" "$VISUDEV_AUDIT_OUT/runtime-logs"
          npm run dev:runner > "$VISUDEV_AUDIT_OUT/runtime-logs/runner.log" 2>&1 &
          echo $! > /tmp/visudev-runner.pid
          npm run dev:engine > "$VISUDEV_AUDIT_OUT/runtime-logs/engine.log" 2>&1 &
          echo $! > /tmp/visudev-engine.pid
          npm run dev:app -- --host 127.0.0.1 > "$VISUDEV_AUDIT_OUT/runtime-logs/app.log" 2>&1 &
          echo $! > /tmp/visudev-app.pid

          for url in http://127.0.0.1:4000/health http://127.0.0.1:4317/health http://127.0.0.1:3005; do
            echo "Waiting for $url"
            ok=0
            for i in $(seq 1 120); do
              if curl -fsS "$url" >/dev/null 2>&1; then
                ok=1
                break
              fi
              sleep 1
            done
            if [ "$ok" -ne 1 ]; then
              echo "Timed out waiting for $url"
              exit 1
            fi
          done

      - name: Run Product Readiness harness for project
        env:
          VISUDEV_STORAGE_DIR: ${{ github.workspace }}/.audit-visudev-storage
          VISUDEV_AUDIT_TARGET: ${{ github.workspace }}/target-repo
          VISUDEV_READINESS_CHECKOUT_OK: ${{ steps.checkout_target.outcome == 'success' || matrix.sourceKind != 'github' }}
        run: |
          set -euo pipefail
          mkdir -p "$VISUDEV_AUDIT_OUT"
          node scripts/readiness/run-project-gate.mjs --project ${{ matrix.id }}

      - name: Record environment proof
        if: always()
        shell: bash
        run: |
          mkdir -p "$VISUDEV_AUDIT_OUT"
          {
            echo "VISUDEV_DEMO_ENRICHMENT=$VISUDEV_DEMO_ENRICHMENT"
            echo "VITE_BLUEPRINT_DEMO_ENRICHMENT=$VITE_BLUEPRINT_DEMO_ENRICHMENT"
            echo "project_id=${{ matrix.id }}"
            echo "gate_mode=${{ matrix.gateMode }}"
            echo "source_kind=${{ matrix.sourceKind }}"
            echo "checkout_repository=${{ matrix.checkoutRepository }}"
            echo "expected_target_commit=${{ matrix.checkoutRef }}"
            echo "visudev_commit=$GITHUB_SHA"
            if [ -d target-repo ] && git -C target-repo rev-parse --verify HEAD >/dev/null 2>&1; then
              git -C target-repo rev-parse HEAD | sed 's/^/target_commit=/'
            else
              echo "target_commit="
            fi
          } > "$VISUDEV_AUDIT_OUT/environment.txt"

      - name: Upload readiness audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-visual-audit-${{ matrix.id }}
          path: /tmp/visudev-real-visual-audit/${{ matrix.id }}/
          if-no-files-found: error
          retention-days: 7

  v1-certification:
    name: V1 Certification Aggregate
    needs: audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout VisuDev
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install VisuDev dependencies
        run: npm ci

      - name: Download all readiness audit artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: real-visual-audit-*
          path: /tmp/visudev-certification
          merge-multiple: false

      - name: Aggregate V1 certification gate
        run: |
          set -euo pipefail
          node scripts/readiness/aggregate-certification.mjs \
            --dir /tmp/visudev-certification \
            --out /tmp/visudev-certification/readiness-certification-report.json

      - name: Upload V1 certification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: readiness-v1-certification-report
          path: /tmp/visudev-certification/readiness-certification-report.json
          if-no-files-found: error
          retention-days: 14
